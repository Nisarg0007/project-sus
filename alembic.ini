# Alembic configuration for SUS — Spike Understanding System.
#
# Database URL is provided by the application's Settings class
# (src/config.py → settings.database_url). Do NOT hardcode a URL here;
# env.py reads it from the app config at runtime.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Placeholder — overridden at runtime by env.py from settings.database_url
sqlalchemy.url = sqlite:///data/sus.db

file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
